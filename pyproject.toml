[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telco-churn-trainer"
version = "0.1.0"
description = "Local-first telco churn classifier used later on Vertex AI."
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2",
  "scikit-learn>=1.5,<1.6",
  "joblib>=1.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "jupyter>=1.0",
  "matplotlib>=3.8",
]
serving = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
